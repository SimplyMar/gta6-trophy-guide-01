<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida Platinum Casebook — GTA VI Trophy Guide</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <p class="kicker">Leonida Platinum Casebook</p>
    <h1>GTA VI Trophy Guide &amp; Tracker</h1>
  </div>

  <div class="kpi-group">
    <div class="kpi-progress">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <p id="progressText">0 / 55 earned</p>
    </div>
    <div class="kpi-pills" id="gradePills" aria-label="Grade breakdown"></div>
    <span class="kpi-badge missable" id="missableBadge">0 Missable</span>
    <span class="kpi-badge online" id="onlineBadge">Online: 0</span>
  </div>

  <div class="kpi-actions">
    <button class="btn btn-ghost" id="exportBtn" type="button">Export JSON</button>
    <label class="btn btn-ghost file-label" for="importInput">Import JSON</label>
    <input class="visually-hidden" id="importInput" type="file" accept="application/json">
  </div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab" data-view="checklist" role="tab">Checklist</button>
  <button class="tab" data-view="roadmap" role="tab">Platinum Roadmap</button>
  <button class="tab" data-view="missables" role="tab">Missables &amp; Counters</button>
  <button class="tab" data-view="backup" role="tab">Export / Import</button>
</nav>

<div class="controls" id="controls">
  <input type="search" id="search" placeholder="Search trophies…" autocomplete="off">
  <label>Category
    <select id="categoryFilter">
      <option value="all">All categories</option>
      <option value="story">Story</option>
      <option value="missable">Missable</option>
      <option value="collectibles">Collectibles</option>
      <option value="activities">Activities</option>
      <option value="combat">Combat</option>
      <option value="online">Online</option>
    </select>
  </label>
  <label>Grade
    <select id="gradeFilter">
      <option value="all">All grades</option>
      <option value="platinum">Platinum</option>
      <option value="gold">Gold</option>
      <option value="silver">Silver</option>
      <option value="bronze">Bronze</option>
    </select>
  </label>
  <label>Status
    <select id="statusFilter">
      <option value="all">All</option>
      <option value="remaining">Remaining</option>
      <option value="earned">Earned</option>
    </select>
  </label>
  <div class="spacer"></div>
  <label class="toggle"><input type="checkbox" id="spoilerShield"> Spoiler Shield</label>
</div>

<main class="layout" id="layout">
  <section class="view-pane" id="viewRoot" aria-live="polite"></section>
  <aside class="detail-pane" id="detailPane"></aside>
</main>

<p class="footnote">Fan-made, offline reference. Not affiliated with or endorsed by Rockstar Games or Take-Two Interactive.</p>

<script type="module" src="js/main.js"></script>
</body>
</html>
